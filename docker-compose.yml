version: "3.9"

services:
  # ── HashiCorp Vault (dev mode – do NOT use in production) ───────────
  vault:
    image: hashicorp/vault:1.17
    container_name: vault-dev
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── vault-demo-web application ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vault-demo-web
    ports:
      - "8080:8080"
    environment:
      # Override individual settings via env vars …
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      VAULT_MOUNT: secret
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      # … OR mount a config file and point CONFIG_FILE at it:
      # CONFIG_FILE: /etc/vault-demo/config.yaml
    # volumes:
    #   - ./config/config.yaml:/etc/vault-demo/config.yaml:ro
    depends_on:
      vault:
        condition: service_healthy
    restart: unless-stopped
