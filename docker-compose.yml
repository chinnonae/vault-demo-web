version: "3.9"

services:
  # ── HashiCorp Vault (dev mode – do NOT use in production) ───────────
  vault:
    image: hashicorp/vault:1.17
    container_name: vault-dev
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Vault Agent – writes secrets to a shared volume ────────────────
  # The agent authenticates to Vault, fetches secrets, renders them
  # to /vault/secrets/, and keeps them up to date.
  vault-agent:
    image: hashicorp/vault:1.17
    container_name: vault-agent
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - vault-secrets:/vault/secrets
      - ./vault-agent:/vault/config:ro     # mount agent config & templates
    environment:
      VAULT_ADDR: http://vault:8200
    entrypoint:
      - vault
      - agent
      - -config=/vault/config/agent.hcl
    # See vault-agent/agent.hcl.example for a starter config

  # ── vault-demo-web application ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vault-demo-web
    ports:
      - "8080:8080"
    volumes:
      # Secrets written by Vault Agent are available here (read-only)
      - vault-secrets:/vault/secrets:ro
    environment:
      # Configuration method 1: environment variables
      SECRETS_SOURCE: file
      SECRETS_PATH: /vault/secrets
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      # Configuration method 2: mount a config file
      # CONFIG_FILE: /etc/vault-demo/config.yaml
    # volumes:
    #   - ./config/config.yaml:/etc/vault-demo/config.yaml:ro
    depends_on:
      - vault-agent
    restart: unless-stopped

volumes:
  vault-secrets:
