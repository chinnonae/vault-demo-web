---
# Example Kubernetes Secret for use with the Vault Secrets Operator.
#
# In production this Secret is created and kept up to date by the
# Vault Secrets Operator (VaultStaticSecret / VaultDynamicSecret CRDs).
# The values below are base64-encoded placeholders – do NOT commit real
# secret values to source control.
#
# To create a placeholder manually:
#   echo -n 'change-me' | base64
#
# The Deployment's envFrom.secretRef mounts all keys from this Secret
# as environment variables.  With SECRETS_ENV_PREFIX=SECRET_ the app
# reads every variable whose name starts with SECRET_.

apiVersion: v1
kind: Secret
metadata:
  name: vault-demo-secrets
  labels:
    app: vault-demo-web
  annotations:
    # Vault Secrets Operator annotation (adjust to your VSO version)
    # secrets.hashicorp.com/v1beta1: "true"
type: Opaque
data:
  # Keys will be exposed as env vars:  SECRET_DB_PASSWORD, SECRET_API_KEY …
  SECRET_DB_PASSWORD: Y2hhbmdlLW1l     # change-me
  SECRET_API_KEY: Y2hhbmdlLW1l         # change-me
